plugins { id 'com.android.application' }

android {
    namespace 'dev.serve.riseautomation'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.serve.riseautomation'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
