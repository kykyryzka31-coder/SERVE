name: Android checks
on:
  push:
  pull_request:
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The action default includes obsolete 'tools', removed from Google's repository.
          packages: platform-tools
          cmdline-tools-version: '13114758'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - run: ./scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-results
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
