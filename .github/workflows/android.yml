name: Android checks
on:
  push:
  pull_request:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required Android SDK packages
        run: |
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build and test
        run: ./scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-results
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
